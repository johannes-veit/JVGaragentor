name: JV Garagentor – Checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-Syntax prüfen
        run: |
          php -l JVGaragentor/module.php
          php -l JVGaragentor/LCNBridge.php
          php -l JVGaragentor/LCNTasten.php
          php -l JVAmpel/module.php
          php -l tests/simulate.php
      - name: JSON prüfen
        run: |
          python3 -m json.tool library.json >/dev/null
          python3 -m json.tool JVGaragentor/module.json >/dev/null
          python3 -m json.tool JVGaragentor/form.json >/dev/null
          python3 -m json.tool JVAmpel/module.json >/dev/null
          python3 -m json.tool JVAmpel/form.json >/dev/null
      - name: JavaScript Syntax der HTML-Kachel
        run: |
          python3 - <<'PYJS'
          import re
          from pathlib import Path
          html=Path('JVGaragentor/module.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>', html, flags=re.S)
          assert len(scripts)==1
          Path('/tmp/jvg-tile.js').write_text(scripts[0], encoding='utf-8')
          PYJS
          node --check /tmp/jvg-tile.js
      - name: Simulierte Statuswechsel und Kommandos
        run: php tests/simulate.php
      - name: HTML-SDK Anzeigezeit und Farblogik
        run: node tests/visual_mock.js
