<!-- JVGaragentor: HTML-SDK-Kachel. Keine externen Ressourcen. -->
<style>
#jvg-root { box-sizing:border-box; width:100%; height:100%; min-height:min(84dvh,1000px); padding:6px; background:#e9e9e9; color:#080808; font:16px Arial,Helvetica,sans-serif }
#jvg-root *,#jvg-root *::before,#jvg-root *::after {box-sizing:border-box}
#jvg-root .jvg-grid {display:grid; width:100%; height:100%; grid-template-columns:minmax(0,2.1fr) minmax(0,1fr); grid-template-rows:minmax(0,1fr) minmax(0,.37fr) minmax(0,1fr); gap:10px}
#jvg-root .jvg-card {container-type:size;background:#fff; box-shadow:0 1px 5px #0002; border-radius:6px; position:relative; min-width:0; min-height:0; overflow:hidden}
#jvg-root .jvg-label {position:absolute; top:4%;left:7%; font-size:clamp(16px,2.1vw,29px);font-weight:400;z-index:1;pointer-events:none}
/* iOS/WebKit: native buttons must not determine icon position via flex or
   intrinsic SVG size. The button and SVG viewport are independently fixed
   to the card. The SVG viewBox keeps the circle square at any tile size. */
#jvg-root .jvg-control {position:absolute;inset:0;width:100%;height:100%;border:0;background:none;margin:0;padding:0;display:block;-webkit-appearance:none;appearance:none;touch-action:manipulation;cursor:pointer}
#jvg-root .jvg-control .jvg-icon {position:absolute;display:block;left:9%;top:12%;width:82%;height:82%;max-width:none;max-height:none;pointer-events:none;overflow:visible;transform-origin:50% 50%}
#jvg-root .jvg-icon-bg {fill:#00c8ad;stroke:none}
#jvg-root .jvg-icon-mark {stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;fill:none}
#jvg-root .jvg-stop .jvg-icon {left:30.65%;top:22%;width:38.7%;height:68%}
#jvg-root .jvg-stop .jvg-icon-mark {stroke-width:5}
#jvg-root .jvg-control:focus-visible {outline:4px solid #1467aa;outline-offset:-6px}
#jvg-root .jvg-control:active .jvg-icon {transform:scale(.97)}
#jvg-root .jvg-control:disabled {opacity:.45;cursor:not-allowed}
#jvg-root .jvg-position {grid-column:2;grid-row:1/4;display:flex;align-items:center;justify-content:center;text-align:center;container-type:inline-size;transition:background-color .15s ease;background:#fff}
/* Sanfte, kontrastreiche Statusbeleuchtung – keine aggressiven Stroboskopblitze. */
#jvg-root .jvg-position.jvg-green {background:#9de1ba;box-shadow:0 0 13px #68bb8b88}
#jvg-root .jvg-position.jvg-red {background:#efaaa7;box-shadow:0 0 13px #dc777788}
#jvg-root .jvg-position.jvg-yellow-flash {animation:jvg-yellow var(--jvg-blink-ms,1600ms) ease-in-out infinite}
#jvg-root .jvg-position.jvg-red-flash {animation:jvg-red var(--jvg-blink-ms,1600ms) ease-in-out infinite}
@keyframes jvg-yellow {0%,100%{background:#faedbf;box-shadow:0 0 5px #eed08c33}50%{background:#f1c76b;box-shadow:0 0 15px #e7ba6199}}
@keyframes jvg-red {0%,100%{background:#f9d5d0;box-shadow:0 0 5px #e9a5a133}50%{background:#ec9992;box-shadow:0 0 15px #dc777799}}
@media (prefers-reduced-motion: reduce) {#jvg-root .jvg-position.jvg-yellow-flash {animation:none;background:#f3d893}#jvg-root .jvg-position.jvg-red-flash{animation:none;background:#efaaa7}}

#jvg-root .jvg-position .jvg-label {left:10%;top:2%;font-size:clamp(15px,11cqw,27px)}
/* Status-Text füllt nur die verfügbare Breite der rechten Spalte, nie darüber hinaus.
   Insbesondere GESTOPPT bleibt auf schmalen Smartphones vollständig lesbar. */
#jvg-root .jvg-state {width:100%;min-width:0;flex:0 1 100%;white-space:pre-line;overflow-wrap:normal;word-break:normal;text-align:center;font-size:clamp(18px,22cqw,96px);line-height:1.12;padding:0 3%}
#jvg-root .jvg-state.jvg-state-long {white-space:nowrap;font-size:min(15cqw,54px)}
#jvg-root .jvg-state.jvg-state-moving {white-space:pre-line;font-size:min(20cqw,70px)}
#jvg-root .jvg-footer {position:absolute;bottom:3%;left:5%;right:5%;display:flex;flex-direction:column;align-items:stretch;gap:4px;max-height:36%;overflow:hidden;pointer-events:none}
#jvg-root .jvg-note {font-size:clamp(10px,4.2cqw,16px);line-height:1.2;color:#a22;max-height:3.6em;overflow:hidden;overflow-wrap:anywhere}
#jvg-root .jvg-note:empty {display:none}
#jvg-root .jvg-percent {font-size:clamp(12px,13cqw,32px);font-weight:500;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
#jvg-root .jvg-eta {font-size:clamp(10px,8cqw,20px);line-height:1.15;overflow-wrap:normal;word-break:normal;font-variant-numeric:tabular-nums}
#jvg-root .jvg-eta:empty {display:none}
@media(max-width:500px){#jvg-root {padding:3px}#jvg-root .jvg-grid {gap:7px}#jvg-root .jvg-label{font-size:clamp(13px,3.3vw,21px)}}
</style>
<div id="jvg-root">
  <div class="jvg-grid">
    <div class="jvg-card" style="grid-column:1;grid-row:1"><div class="jvg-label">AUF</div>
      <button type="button" class="jvg-control" data-jvg-command="AUF" aria-label="Garagentor öffnen" disabled>
        <svg class="jvg-icon" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><circle class="jvg-icon-bg" cx="50" cy="50" r="50"/><g class="jvg-icon-mark" transform="translate(19 19) scale(0.62)"><path d="M50 88V12M14 48 50 12 86 48"/></g></svg>
      </button>
    </div>
    <div class="jvg-card jvg-stop" style="grid-column:1;grid-row:2"><div class="jvg-label">STOP</div>
      <button type="button" class="jvg-control" data-jvg-command="STOP" aria-label="Garagentor stoppen" disabled>
        <svg class="jvg-icon" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><circle class="jvg-icon-bg" cx="50" cy="50" r="50"/><g class="jvg-icon-mark" transform="translate(18.5 18.5) scale(0.63)"><circle cx="50" cy="50" r="38"/><rect x="35" y="35" width="30" height="30" rx="1"/></g></svg>
      </button>
    </div>
    <div class="jvg-card" style="grid-column:1;grid-row:3"><div class="jvg-label">ZU</div>
      <button type="button" class="jvg-control" data-jvg-command="ZU" aria-label="Garagentor schließen" disabled>
        <svg class="jvg-icon" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><circle class="jvg-icon-bg" cx="50" cy="50" r="50"/><g class="jvg-icon-mark" transform="translate(19 19) scale(0.62)"><path d="M50 12V88M14 52 50 88 86 52"/></g></svg>
      </button>
    </div>
    <div class="jvg-card jvg-position"><div class="jvg-label">Position</div>
      <div class="jvg-state" role="status" aria-live="polite">GESTOPPT</div>
      <div class="jvg-footer">
        <div class="jvg-note"></div>
        <div class="jvg-percent" aria-label="Schließgrad">– %</div>
        <div class="jvg-eta"></div>
      </div>
    </div>
  </div>
</div>
<script>
(function () {
  'use strict';
  const root = document.getElementById('jvg-root');
  if (!root) return;
  const buttons = root.querySelectorAll('[data-jvg-command]');
  const initial = __JV_INITIAL__;
  let ready = false;
  let latest = null;
  let shownSignal = -1;
  const positionCard = root.querySelector('.jvg-position');
  const positionText = root.querySelector('.jvg-state');
  const percentText = root.querySelector('.jvg-percent');
  const etaText = root.querySelector('.jvg-eta');
  const effectClasses = ['jvg-yellow-flash','jvg-green','jvg-red-flash','jvg-red'];
  function renderSignal() {
    if (!latest) return;
    let sig = Number(latest.signal || 0);
    const until = Number(latest.effectUntil || 0);
    // Bei ausbleibenden Live-Meldungen nach Ablauf lokal neutral werden.
    if (sig < 0 || sig > 4 || !Number.isFinite(sig) || until <= 0 || Date.now() >= until * 1000) sig = 0;
    if (shownSignal !== sig) {
      positionCard.classList.remove(...effectClasses);
      if (sig > 0) positionCard.classList.add(effectClasses[sig - 1]);
      shownSignal = sig;
    }
  }
  function renderEstimate() {
    if (!latest) return;
    const p = latest.positionPercent;
    const remaining = latest.positionRemaining;
    const moving = latest.position === 'LÄUFT AUF' || latest.position === 'LÄUFT ZU';
    const fresh = !moving || Date.now() < Number(latest.positionEstimateUntil || 0)*1000;
    const valid = latest.online === true && fresh && Number.isInteger(p) && p >= 0 && p <= 100;
    percentText.textContent = valid ? ((p>0 && p<100 ? 'ca. ' : '') + p + ' %') : '– %';
    etaText.textContent = valid && moving && Number.isInteger(remaining) && remaining >= 0
      ? (remaining === 0 ? 'Endlage erwartet' : (latest.position === 'LÄUFT AUF' ? 'Offen in ' : 'Geschlossen in ') + remaining + ' s')
      : '';
  }
  function show(s) {
    if (!s || typeof s !== 'object') return;
    const valid = ['AUF','ZU','LÄUFT AUF','LÄUFT ZU','GESTOPPT'];
    latest = s;
    const pos = valid.includes(s.position) ? s.position : 'GESTOPPT';
    const period = Number(s.blinkPeriodMs || 1600);
    positionCard.style.setProperty('--jvg-blink-ms', Math.min(4000, Math.max(500, period)) + 'ms');
    renderSignal();
    renderEstimate();
    positionText.classList.toggle('jvg-state-long', pos === 'GESTOPPT');
    positionText.classList.toggle('jvg-state-moving', pos.startsWith('LÄUFT '));
    positionText.textContent = pos.replace('LÄUFT ', 'LÄUFT\n');
    ready = s.enabled === true && s.online === true && s.ready === true;
    const canStop = s.enabled === true && s.online === true;
    const info = !s.enabled ? 'TESTMODUS – Befehle gesperrt' :
      !s.online ? 'Shelly OFFLINE – Befehle gesperrt' : (s.warning || (!s.ready ? 'Konfiguration prüfen – Befehle gesperrt' : ''));
    root.querySelector('.jvg-note').textContent = info;
    buttons.forEach(b => { b.disabled = (b.dataset.jvgCommand === 'STOP') ? !canStop : !ready; });
  }
  buttons.forEach(b => b.addEventListener('click', () => {
    if (b.disabled || typeof requestAction !== 'function') return;
    // Der Server prüft die Freigabe und Endlagen nochmals.
    requestAction('Command', b.dataset.jvgCommand);
  }));
  show(initial);
  // Auch wenn die mobile Verbindung unterbrochen wird, endet die Darstellung rechtzeitig.
  setInterval(() => { renderSignal(); renderEstimate(); }, 250);
  // HTML-SDK erhält Status-Updates über diese Funktion.
  window.handleMessage = function (msg) {
    try { show(typeof msg === 'string' ? JSON.parse(msg) : msg); }
    catch (e) { console.error('JVGaragentor: Statusnachricht ungültig', e); }
  };
})();
</script>
