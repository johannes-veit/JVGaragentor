<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--accent:#04c7ae;--bg:#ebebeb;--fg:#080808}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;color:var(--fg);background:var(--bg)}
.gate{height:100%;width:100%;display:grid;grid-template-columns:minmax(0,2.08fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,.38fr) minmax(0,1fr);gap:12px;padding:12px}
.cell{position:relative;min-width:0;min-height:0;overflow:hidden;border-radius:6px;background:#fff;box-shadow:0 1px 4px #0003;container-type:size}
.cell h2{position:absolute;top:5%;left:8%;z-index:1;margin:0;font-size:clamp(14px,3.7cqw,30px);font-weight:400;pointer-events:none}
.action{display:flex;align-items:center;justify-content:center;width:100%;height:100%;padding:8% 5% 3%;border:0;appearance:none;background:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.action:focus-visible{outline:4px solid #007b8e;outline-offset:-5px}
.circle{width:min(88%,87cqh);aspect-ratio:1;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center}
.circle svg{width:64%;height:64%;stroke:#fff;stroke-width:6;fill:none;stroke-linecap:round;stroke-linejoin:round}
.stop .circle{width:min(45%,75cqh)}
.stop .circle svg{width:67%;height:67%;stroke-width:5}
.position{grid-column:2;grid-row:1/4;container-type:inline-size;display:flex;align-items:center;justify-content:center;text-align:center}
.position h2{top:3%;left:14%;font-size:clamp(14px,10cqw,30px)}
#status{width:100%;padding:0 2%;font-size:clamp(23px,21cqw,90px);line-height:1.12;white-space:pre-line;overflow-wrap:break-word;font-weight:400}
#info{position:absolute;bottom:3%;left:2%;right:2%;font-size:clamp(10px,4cqw,17px);color:#555}
.action:disabled{cursor:not-allowed;opacity:.45}
.action:active .circle{transform:scale(.98)}
@media(max-width:360px){.gate{gap:6px;padding:6px}}
</style>
</head>
<body>
<main class="gate" aria-label="Garagentor">
  <section class="cell" style="grid-column:1;grid-row:1">
    <h2>AUF</h2>
    <button class="action control" data-command="AUF" aria-label="Garagentor öffnen" disabled>
      <span class="circle"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 88V12M16 46 50 12 84 46"/></svg></span>
    </button>
  </section>
  <section class="cell stop" style="grid-column:1;grid-row:2">
    <h2>STOP</h2>
    <button class="action control" data-command="STOP" aria-label="Garagentor stoppen" disabled>
      <span class="circle"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38"/><rect x="37" y="37" width="26" height="26" rx="2"/></svg></span>
    </button>
  </section>
  <section class="cell" style="grid-column:1;grid-row:3">
    <h2>ZU</h2>
    <button class="action control" data-command="ZU" aria-label="Garagentor schließen" disabled>
      <span class="circle"><svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 12V88M16 54 50 88 84 54"/></svg></span>
    </button>
  </section>
  <section class="cell position">
    <h2>Position</h2>
    <div id="status" role="status" aria-live="polite">GESTOPPT</div>
    <div id="info"></div>
  </section>
</main>
<script>
const initialState = __INITIAL_STATE__;
const controls = document.querySelectorAll('.control');
const allowed = ['AUF','ZU','LÄUFT AUF','LÄUFT ZU','GESTOPPT'];
let controlReady = false;
function applyState(state) {
  if (!state || typeof state !== 'object') return;
  const position = allowed.includes(state.position) ? state.position : 'GESTOPPT';
  document.getElementById('status').textContent = position.replace('LÄUFT ','LÄUFT\n');
  controlReady = !!state.enabled && !!state.online;
  controls.forEach(button => { button.disabled = !controlReady; });
  document.getElementById('info').textContent =
    !state.enabled ? 'TESTMODUS – STEUERUNG AUS' :
    !state.online ? 'SHELLY OFFLINE' : '';
}
function handleMessage(message) {
  try { applyState(typeof message === 'string' ? JSON.parse(message) : message); }
  catch (error) { console.error('Garagentor-Status nicht lesbar', error); }
}
controls.forEach(button => {
  button.addEventListener('click', () => {
    if (!controlReady) return;
    if (typeof requestAction !== 'function') return;
    requestAction('Command', button.dataset.command);
  });
});
applyState(initialState);
</script>
</body>
</html>
