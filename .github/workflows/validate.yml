name: Module static checks
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          php -l JVGaragentor/module.php
          php -l JVAmpel/module.php
      - name: JSON syntax
        run: |
          python3 -m json.tool library.json >/dev/null
          python3 -m json.tool JVGaragentor/module.json >/dev/null
          python3 -m json.tool JVGaragentor/form.json >/dev/null
          python3 -m json.tool JVAmpel/module.json >/dev/null
          python3 -m json.tool JVAmpel/form.json >/dev/null
      - name: HTML SDK essentials
        run: |
          grep -q 'function handleMessage' JVGaragentor/module.html
          grep -q 'requestAction(' JVGaragentor/module.html
          grep -q 'GetVisualizationTile' JVGaragentor/module.php
          grep -q 'SetVisualizationType' JVGaragentor/module.php
